<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a14"/>
      <stop offset="50%" stop-color="#121124"/>
      <stop offset="100%" stop-color="#05050a"/>
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="neonViolet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="glowHalo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Circle with Soft Border -->
  <circle cx="128" cy="128" r="126" fill="url(#bgGrad)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="2"/>
  <circle cx="128" cy="128" r="110" fill="url(#glowHalo)"/>

  <!-- Matrix/Grid Ambient Micro-Dots -->
  <circle cx="64" cy="64" r="1.5" fill="#38bdf8" opacity="0.4"/>
  <circle cx="192" cy="70" r="1.5" fill="#c084fc" opacity="0.4"/>
  <circle cx="48" cy="140" r="1" fill="#38bdf8" opacity="0.3"/>
  <circle cx="210" cy="130" r="1" fill="#c084fc" opacity="0.3"/>

  <!-- Hoodie / Shoulders Silhouette -->
  <path d="M48 238 C 50 188, 80 162, 128 162 C 176 162, 206 188, 208 238 Z" fill="#181829" stroke="rgba(192, 132, 252, 0.25)" stroke-width="2"/>
  
  <!-- Hoodie Inner Collar / Zipper Accent -->
  <path d="M102 172 L 128 206 L 154 172" fill="none" stroke="#232338" stroke-width="4" stroke-linecap="round"/>
  <path d="M128 206 L 128 240" fill="none" stroke="url(#neonViolet)" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Head / Face Silhouette -->
  <ellipse cx="128" cy="116" rx="46" ry="52" fill="#141422" stroke="rgba(56, 189, 248, 0.28)" stroke-width="1.8"/>

  <!-- Cyber Hair / Tech Cap Silhouette -->
  <path d="M82 104 C 84 68, 110 54, 128 54 C 146 54, 172 68, 174 104 C 166 84, 150 74, 128 74 C 106 74, 90 84, 82 104 Z" fill="#24243b"/>
  <path d="M82 98 C 96 78, 118 70, 144 72 C 158 74, 168 80, 174 88" fill="none" stroke="url(#neonViolet)" stroke-width="2" stroke-linecap="round" opacity="0.8"/>

  <!-- Cyber Glasses / HUD Visor Frame -->
  <g filter="url(#glow)">
    <rect x="92" y="104" width="30" height="18" rx="5" fill="#0d1f2d" stroke="url(#neonCyan)" stroke-width="2.2"/>
    <rect x="134" y="104" width="30" height="18" rx="5" fill="#0d1f2d" stroke="url(#neonCyan)" stroke-width="2.2"/>
    <line x1="122" y1="113" x2="134" y2="113" stroke="url(#neonCyan)" stroke-width="2.2"/>
  </g>

  <!-- Glowing Code Reflections on Lenses -->
  <text x="96" y="117" font-family="monospace" font-size="11" font-weight="bold" fill="#38bdf8" opacity="0.95">&lt;/&gt;</text>
  <text x="138" y="117" font-family="monospace" font-size="11" font-weight="bold" fill="#38bdf8" opacity="0.95">&gt;_*</text>

  <!-- Developer Headset / Headphones Rim Light -->
  <path d="M78 102 C 72 102, 70 114, 70 124 C 70 134, 74 140, 80 140" fill="none" stroke="url(#neonCyan)" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M178 102 C 184 102, 186 114, 186 124 C 186 134, 182 140, 176 140" fill="none" stroke="url(#neonViolet)" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Subtle Minimal Smile / Focus Expression -->
  <path d="M120 144 Q 128 148 136 144" fill="none" stroke="rgba(255, 255, 255, 0.4)" stroke-width="1.8" stroke-linecap="round"/>
</svg>